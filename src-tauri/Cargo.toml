[package]
name = "ai-finance-moyu"
version = "0.1.0"
description = "A股摸鱼悬浮窗"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_finance_moyu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` and `image-*` features are required for system tray and icons in Tauri v2
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
notify-rust = "4"

# HTTP for quote fetching. `no_proxy()` on the client bypasses the machine's
# HTTP_PROXY/HTTPS_PROXY env vars, which would otherwise tunnel domestic
# quote requests through 127.0.0.1:7890.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
# Tencent's quote endpoints respond in GB18030, NOT UTF-8.
encoding_rs = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = "0.4"
tauri-plugin-single-instance = "2.5.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
