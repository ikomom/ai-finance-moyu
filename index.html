<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>moyu</title>
    <!-- Boot diagnostics. A transparent widget that fails to start shows
         *nothing at all* — no window chrome, no error, just an invisible hole.
         The overlay element and its styles live here so they paint before any
         script runs; the error hooks themselves live in `src/boot.ts` because
         the app enforces `script-src 'self'`, which forbids inline scripts and
         with them the `<img onerror=…>` XSS primitive. -->
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      #boot-err {
        position: fixed;
        inset: 0;
        z-index: 999;
        margin: 0;
        padding: 8px;
        box-sizing: border-box;
        background: rgba(60, 12, 12, 0.97);
        color: #ffd9d9;
        font: 10px/1.45 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow: auto;
        border: 1px solid #e64545;
        border-radius: 8px;
      }
      #boot-err[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-err" hidden></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
