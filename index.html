<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>moyu</title>
    <!-- Boot diagnostics. A transparent widget that fails to start shows
         *nothing at all* — no window chrome, no error, just an invisible hole.
         Both the styles and the hooks are inline so they still work when the
         module itself fails to load, which is the case they most need to
         explain. -->
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      #boot-err {
        position: fixed;
        inset: 0;
        z-index: 999;
        margin: 0;
        padding: 8px;
        box-sizing: border-box;
        background: rgba(60, 12, 12, 0.97);
        color: #ffd9d9;
        font: 10px/1.45 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow: auto;
        border: 1px solid #e64545;
        border-radius: 8px;
      }
      #boot-err[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-err" hidden></div>

    <script>
      (function () {
        var box = document.getElementById('boot-err')
        box.onclick = function () {
          box.hidden = true
        }
        function show(label, detail) {
          box.hidden = false
          box.textContent += label + ': ' + detail + '\n'
        }
        window.__bootErrs = []
        window.addEventListener('error', function (ev) {
          var where = ev.filename ? ' @ ' + ev.filename + ':' + ev.lineno : ''
          show('加载错误', (ev.message || String(ev.error)) + where)
        })
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev.reason
          show('未处理的异常', (r && (r.stack || r.message)) || String(r))
        })
        // Prove the inline hook itself ran, even if the module never does.
        window.__bootOk = false
        show('引导', '内联脚本已执行，等待前端模块…')
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
