name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Type Check & Build Frontend
        run: npm run build

      - name: Frontend Unit Tests
        run: npm test

      - name: Cargo Check Backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # Lint gate. This used to be missing, which is how a deny-level
      # `clippy::approx_constant` in a test literal survived unnoticed.
      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Backend Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
